services:
  - type: web
    name: glowself
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: QWEN_API_KEY
        sync: false
      - key: QWEN_BASE_URL
        value: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      - key: QWEN_MODEL
        value: qwen3.8-max
      - key: JWT_SECRET
        generateValue: true
      - key: DB_DIR
        value: /opt/render/project/src/data
      - key: BASE_URL
        sync: false
      - key: WXPAY_MCHID
        sync: false
      - key: WXPAY_APPID
        sync: false
      - key: WXPAY_SERIAL_NO
        sync: false
      - key: WXPAY_PRIVATE_KEY
        sync: false
      - key: WXPAY_API_V3_KEY
        sync: false
      - key: WXPAY_NOTIFY_URL
        sync: false
