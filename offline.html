<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>暂时离线｜GlowSelf 光绽</title>
  <meta name="description" content="GlowSelf 离线页：网络恢复后可继续查看你的色彩报告、衣橱和 30 天计划。">
  <meta name="robots" content="noindex,nofollow">
  <meta property="og:image" content="https://glowself.cn/assets/img/og-cover.png">
  <meta name="theme-color" content="#f6f1e8">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <style>
    :root { --paper:#f6f1e8; --ink:#1f1b16; --muted:#786d5f; --accent:#bf4b32; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; padding:28px; }
    main { max-width:440px; text-align:center; }
    img { width:66px; height:66px; }
    .k { margin:26px 0 12px; font-size:9px; letter-spacing:.22em; color:var(--accent); }
    h1 { margin:0 0 14px; font-family:"Songti SC","Noto Serif SC",serif; font-weight:400; font-size:40px; line-height:1.35; }
    p { margin:0 0 24px; font-size:13px; line-height:1.9; color:var(--muted); }
    .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    a, button { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 20px; border-radius:999px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); text-decoration:none; font:inherit; font-size:12px; cursor:pointer; }
    a.ghost, button.ghost { background:transparent; color:var(--ink); border-color:#ded3c3; }
    footer { margin-top:44px; font-size:9px; letter-spacing:.08em; color:#9a8f80; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/mark.svg" alt="">
    <div class="k">OFFLINE · GLOWSELF</div>
    <h1>网络走开了，<br>你的颜色还在。</h1>
    <p>报告、衣橱和计划都存在这台设备上。恢复网络后，今天的 look 和测试结果会继续更新。</p>
    <div class="actions">
      <a href="/app.html">回到我的空间</a>
      <button class="ghost" onclick="location.reload()">重新连接</button>
    </div>
    <footer>光绽 GlowSelf · 不评分，不排名</footer>
  </main>
</body>
</html>
